version: "3.9"

services:
  app:
    build: .
    container_name: cttest-api
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:mysql://db:3306/demo
      DB_USERNAME: root
      DB_PASSWORD: msandbox
      JPA_DDL_AUTO: validate
      JPA_SHOW_SQL: "false"
      JWT_SECRET: ${JWT_SECRET:-NGE2YjUzNk5pbGx5ckNvZGVTZWNyZXRLZXlGb3JKV1RTaWduaW5n}
      JWT_EXPIRATION_MS: 86400000
      LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cttest-network

  db:
    image: mysql:8.0
    container_name: cttest-db
    environment:
      MYSQL_ROOT_PASSWORD: msandbox
      MYSQL_DATABASE: demo
    ports:
      - "8033:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - cttest-network

networks:
  cttest-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local
